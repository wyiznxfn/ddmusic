name: Android CI
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: |
          ls -la
          chmod +x gradlew
      
      - name: Build APK
        run: ./gradlew assembleDebug

      # 重点：全局搜索所有apk，日志输出真实位置
      - name: Find apk file
        run: find . -name "*.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ddmusic-apk
          path: ./**/*.apk
